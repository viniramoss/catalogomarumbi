<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Açougue Marumbi | Catálogo de preços</title>
    <meta name="description" content="Catálogo de preços das unidades do Açougue Marumbi, em Curitiba." />
    <meta name="author" content="Marumbi" />
    <meta name="color-scheme" content="light dark" />

    <!-- Modo claro ou escuro conforme o sistema da pessoa (sem preferência, fica claro).
         Roda antes da página aparecer para não piscar. -->
    <script>
      (function () {
        var escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var aplicar = function () {
          document.documentElement.classList.toggle('dark', !!(escuro && escuro.matches));
        };
        aplicar();
        if (escuro && escuro.addEventListener) escuro.addEventListener('change', aplicar);
        else if (escuro && escuro.addListener) escuro.addListener(aplicar);
      })();
    </script>

    <meta property="og:title" content="Açougue Marumbi | Catálogo de preços" />
    <meta property="og:description" content="Casa de Carnes Marumbi" />

    <link rel="icon" type="image/png" href="./src/logo/boiSemFMelhor.png" />

    <meta name="twitter:site" content="@casadecarnesmarumbi" />
    <meta name="twitter:image" content="./src/images/LogoMarumbiS.png" />
